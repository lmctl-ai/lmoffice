name: Qualify private lmoffice draft

on:
  repository_dispatch:
    types: [lmoffice-release-draft]
  workflow_dispatch:
    inputs:
      tag:
        description: Replay a recorded candidate (older/revoked candidates are refused)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lmoffice-qualification-${{ inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_release*.py'
      - run: python3 tests/mutate-release-pipeline.py

  candidate:
    needs: regression
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      failure_control: ${{ steps.candidate.outputs.failure_control }}
      seal_asset_id: ${{ steps.candidate.outputs.seal_asset_id }}
      bundle_asset_id: ${{ steps.candidate.outputs.bundle_asset_id }}
      seal_sha256: ${{ steps.candidate.outputs.seal_sha256 }}
      sums_sha256: ${{ steps.candidate.outputs.sums_sha256 }}
      artifact: lmoffice-draft-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify private attestation and fetch the frozen candidate without executing it
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
          SEAL_ASSET_ID: ${{ github.event.client_payload.seal_asset_id }}
          BUNDLE_ASSET_ID: ${{ github.event.client_payload.bundle_asset_id }}
          FREEZE_SHA: ${{ github.event.client_payload.seal_sha256 }}
        run: python3 scripts/download-draft-candidate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmoffice-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: draft-assets/*
          if-no-files-found: error

  qualify-macos-arm64:
    needs: candidate
    name: Qualify macos-arm64
    runs-on: macos-15
    permissions:
      contents: read
    env:
      LMOFFICE_DISABLE_RENDER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          asset: lmoffice-macos-arm64
          name: macos-arm64
          python: python3
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}

  integration:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, asset: lmoffice-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, asset: lmoffice-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, asset: lmoffice-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, asset: lmoffice-windows-x64.exe, python: python }
    name: Qualify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      LMOFFICE_DISABLE_RENDER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          asset: ${{ matrix.asset }}
          name: ${{ matrix.name }}
          python: ${{ matrix.python }}
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}

  deliberate-failure-test:
    needs: [candidate, integration]
    if: ${{ needs.candidate.outputs.failure_control == 'true' && needs.integration.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Run the deliberate public failure-path test
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deliberate public qualification failure

          The five-platform integration matrix passed. This throwaway dispatch
          now fails one public test so the draft retention and no-promotion path
          can be verified.
          SUMMARY
          python3 - <<'PY'
          import unittest
          class FailurePathTest(unittest.TestCase):
              def test_public_draft_is_not_promoted_after_a_test_failure(self):
                  self.fail("deliberate public draft qualification failure")
          unittest.main()
          PY

  promote:
    needs: [regression, candidate, qualify-macos-arm64, integration, deliberate-failure-test]
    if: ${{ always() && !cancelled() && needs.regression.result == 'success' && needs.candidate.result == 'success' && needs.qualify-macos-arm64.result == 'success' && needs.integration.result == 'success' && ((needs.candidate.outputs.failure_control == 'false' && needs.deliberate-failure-test.result == 'skipped') || (needs.candidate.outputs.failure_control == 'true' && needs.deliberate-failure-test.result == 'failure')) }}
    concurrency:
      group: lmoffice-release-mutation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Recheck provenance and frozen IDs, then publish or clean only the sealed throwaway
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          SEAL_ASSET_ID: ${{ needs.candidate.outputs.seal_asset_id }}
          BUNDLE_ASSET_ID: ${{ needs.candidate.outputs.bundle_asset_id }}
          FREEZE_SHA: ${{ needs.candidate.outputs.seal_sha256 }}
          SEALED_THROWAWAY: ${{ needs.candidate.outputs.failure_control }}
        run: |
          set -euo pipefail
          mode=promote
          if [ "$SEALED_THROWAWAY" = true ]; then mode=cleanup; fi
          python3 scripts/manage-qualified-draft.py "$mode" draft-assets
